</style></head><body><header><div class="eyebrow">Germany Study Consulting · Internal KB</div><h1>德国留学可搜索资料库 <span class="pilltop">v1.0</span></h1><div class="sub">把德国留学常见问题整理成一个可以直接搜索的知识库。从申请条件、专业匹配、APS、语言、选校，到费用、签证、就业与留德，需要的时候搜一下，就能快速找到参考解答、判断要点和官方核查方向。<br>最后核查：2026-09-06 · 当前收录 <b>115</b> 个问题。</div></header><div class="toolbar"><div class="toolbar-inner"><div class="searchrow"><input id="search" class="search" placeholder="搜索：APS / 跨专业 / 双非 / VPD / 德语 / 打工 / 计算机…"><button id="policy">只看政策易变</button><button id="expand">全部展开</button><button id="clear">清空</button></div><div id="filters" class="filters"></div></div></div><main><div class="stats"><span id="count"></span><span>点击问题展开答案</span></div><section id="grid" class="grid"></section></main><div class="footer">使用原则：① 先判断申请人属于“信息问题”还是“决策问题”；② 具体项目录取条件回到大学官网；③ APS 回到审核部官网；④ 签证、资金、打工、居留回到德国官方信息；⑤ 不保录、不装懂、不把公开信息包装成独家信息差。</div><div id="toast" style="position:fixed;right:18px;bottom:18px;background:#171717;color:#fff;padding:10px 14px;border-radius:10px;opacity:0;transition:.2s;z-index:99"></div><script>
const DATA=[{"cat": "背景评估", "q": "我的本科背景能申请德国硕士吗？", "aliases": ["双非能申吗", "本科能不能申德国", "背景够不够"], "answer": "不能只看985/211/双非。德国硕士通常更关注本科专业与目标硕士的相关性、课程匹配、成绩、语言，以及项目自己的附加条件。具体到某个项目，要以当年的 Zulassungsvoraussetzungen / Admission Requirements 为准。", "ask": ["本科学校与专业？", "均分/GPA？", "是否已毕业并取得学位？", "目标专业/学校？", "德语和英语水平？"], "risk": "“学校层次+均分”承诺能录取只能作为参考，仍需结合具体情况综合判断。", "tags": ["高频", "硕士", "必须查官网"], "src": "DAAD / uni-assist"}, {"cat": "背景评估", "q": "双非可以申请德国好大学吗？", "aliases": ["双非德国", "双非能申TU9吗"], "answer": "可以申请，但不能把“可以申请”理解成“一定会录”。德国项目通常不会简单按中国的985/211/双非三档录取，更应该看专业匹配、成绩、课程学分、语言和项目自己的选拔规则。", "ask": ["本科专业与目标专业是否一致？", "核心专业课成绩？", "具体目标项目？"], "risk": "不宜简单认为“德国完全不看学校背景”或“TU9随便申”。", "tags": ["高频", "背景"], "src": "DAAD / 各高校官网"}, {"cat": "背景评估", "q": "均分80左右能申请德国吗？", "aliases": ["80分能申吗", "GPA不高", "成绩一般"], "answer": "80分本身不足以判断。不同学校、专业和评分体系要求不同；有的项目设最低成绩，有的还看课程匹配或额外选拔。要把成绩与本科专业、课程结构和目标项目一起判断。", "ask": ["均分精确多少？", "本科院校和专业？", "核心专业课成绩？", "目标项目是否有最低成绩？"], "risk": "不要自行简单换算德国分数后就下录取结论。", "tags": ["高频", "成绩"], "src": "uni-assist / 各高校官网"}, {"cat": "背景评估", "q": "挂过科还能申请德国吗？", "aliases": ["挂科影响", "补考", "重修"], "answer": "有挂科不等于自动失去申请资格。更重要的是最终成绩、成绩单呈现、整体表现，以及挂科课程是否恰好是目标专业要求的核心先修课。", "ask": ["挂了什么课？", "是否补考/重修通过？", "目标专业是否要求这门课？"], "risk": "涉及具体项目时查课程学分要求。", "tags": ["成绩"], "src": "各高校官网"}, {"cat": "背景评估", "q": "专升本可以申请德国硕士吗？", "aliases": ["专升本德国", "大专升本科"], "answer": "不能只凭“专升本”三个字判断。要看完整学历路径、学历是否被认可、是否取得学士学位，以及目标高校的硕士入学资格要求。先确认学历资格，再谈具体项目。", "ask": ["专科和本科分别是什么学校/形式？", "是否有毕业证和学位证？", "是否已有APS？"], "risk": "学历资格问题不要凭经验拍板。", "tags": ["学历", "必须查官网"], "src": "APS / DAAD"}, {"cat": "背景评估", "q": "自考本科/成人本科可以申请德国硕士吗？", "aliases": ["自考", "成人本科", "非全日制"], "answer": "这类情况需要个案核查，核心是德国方面是否认可你的学历路径并认定你具备相应高校入学资格。先核实APS/学历资格，再看硕士项目要求。", "ask": ["学历取得方式？", "是否有学士学位？", "学校与专业？"], "risk": "不宜简单概括为“可以”或“不可以”。", "tags": ["学历", "必须查官网"], "src": "APS / DAAD"}, {"cat": "背景评估", "q": "本科还没毕业能申请德国硕士吗？", "aliases": ["大四申请", "预毕业"], "answer": "很多德国硕士允许应届生在满足一定已修学分或证明条件时先申请，但是否可以、何时补交学位证，由具体项目决定。", "ask": ["现在大几？", "已修多少学分？", "目标学校是否允许在读申请？"], "risk": "不同学校和项目的规定可能存在明显差异，应以目标项目页面的最新要求为准。", "tags": ["应届生", "必须查官网"], "src": "各高校官网"}, {"cat": "背景评估", "q": "28/30岁了还适合去德国读硕士吗？", "aliases": ["年龄大", "工作后留学"], "answer": "年龄本身通常不是最核心变量。更应该看机会成本：现在的工作与收入、读书所需时间和预算、毕业后的职业目标、是否愿意学德语，以及德国留学能否解决你当前真正的问题。", "ask": ["现在工作和收入？", "为什么想留学？", "毕业后留德还是回国？", "预算和可接受时间？"], "risk": "不宜仅用“年龄不是问题”这种空泛鼓励替代成本判断。", "tags": ["决策", "高频", "真人判断"], "src": "综合判断"}, {"cat": "背景评估", "q": "工作几年后再去德国读研会吃亏吗？", "aliases": ["工作党留学", "毕业多年"], "answer": "不一定。相关工作经历可能帮助解释申请动机和职业目标，但很多项目更看本科课程匹配，工作经验不能替代缺失的先修课程。还要考虑语言、时间和机会成本。", "ask": ["工作几年？", "工作内容与目标专业关系？", "本科课程是否匹配？"], "risk": "相关工作经验可能增强申请背景，但通常不能替代项目明确要求的本科先修课程或学分。", "tags": ["工作党", "决策"], "src": "各高校官网 / 综合判断"}, {"cat": "背景评估", "q": "我到底适不适合德国？", "aliases": ["德国适合我吗", "值不值得去德国"], "answer": "建议用五个维度判断：专业是否有合适项目、是否接受德语学习成本、预算是否现实、能否接受德国学习和申请节奏、以及目标究竟是学历、转专业、就业、体验还是长期留德。", "ask": ["专业目标？", "语言接受度？", "预算？", "时间节点？", "留德还是回国？"], "risk": "是否适合德国需要同时考虑优势与成本，包括专业匹配、语言、预算、时间投入及毕业后的发展目标。", "tags": ["高频", "决策", "真人判断"], "src": "综合判断"}, {"cat": "专业与跨专业", "q": "德国硕士可以跨专业申请吗？", "aliases": ["跨专业", "转专业", "换专业"], "answer": "德国硕士整体比较强调本科与硕士的专业连续性，但不能简单说“德国不能跨专业”。关键在目标项目对本科专业、具体课程和学分的要求。相邻方向通常比大跨度转专业更现实。", "ask": ["本科专业？", "目标专业？", "修过哪些相关课程和学分？"], "risk": "需要注意“能跨”或“不能跨”。", "tags": ["高频", "跨专业", "必须查官网"], "src": "uni-assist / 各高校官网"}, {"cat": "专业与跨专业", "q": "商科能转计算机吗？", "aliases": ["商科转CS", "金融转计算机"], "answer": "不能一概而论。很多计算机硕士会明确要求数学、编程、算法、数据结构、理论计算机等先修课程和学分。若本科缺失这些课程，自学经历往往不能替代正式学分要求；可同时寻找信息系统、数据分析等交叉项目。", "ask": ["本科数学/编程/统计课程？", "目标是纯CS还是数据/信息系统？"], "risk": "必须逐项目核对先修课程和ECTS。", "tags": ["跨专业", "计算机", "必须查官网"], "src": "各高校官网"}, {"cat": "专业与跨专业", "q": "工科可以转商科或管理吗？", "aliases": ["工科转商科", "工程转管理"], "answer": "部分管理、工程管理、技术管理项目允许或偏好理工背景，但传统金融、经济学等项目可能要求经济、数学、统计等特定学分。应优先寻找与本科背景有自然连接的交叉项目。", "ask": ["本科专业？", "目标是Management、Finance还是Economics？", "经管/数学课程？"], "risk": "Management、Finance、Economics、Engineering Management等方向的本科背景和课程要求可能明显不同。", "tags": ["跨专业", "商科"], "src": "各高校官网"}, {"cat": "专业与跨专业", "q": "文科能转商科吗？", "aliases": ["文科转商科", "语言转商科"], "answer": "部分泛管理或国际商务项目可能接受多元本科背景，但金融、经济学、数据型商科通常会要求数学、统计、经济学等学分。需要按项目拆解。", "ask": ["本科专业？", "数学/统计/经济课程？", "目标项目？"], "risk": "MBA与普通授课型Master在申请对象、工作经验及课程定位等方面通常存在明显差异。", "tags": ["跨专业", "商科"], "src": "各高校官网"}, {"cat": "专业与跨专业", "q": "建筑/设计可以转城市规划、景观或房地产吗？", "aliases": ["建筑转规划", "建筑转景观", "建筑转房地产"], "answer": "这些方向之间有一定相关性，但要求差异很大。规划可能看规划/城市课程，景观可能要求作品集与相关设计基础，房地产可能偏经济、管理或工程。建筑背景有连接优势，但仍需逐项目核对。", "ask": ["本科课程？", "有无作品集？", "目标偏设计还是管理？"], "risk": "建筑、城市规划、景观和房地产虽存在交叉，但各项目对本科背景、课程及作品集的要求并不相同。", "tags": ["建筑", "跨专业"], "src": "各高校官网"}, {"cat": "语言", "q": "不会德语可以去德国留学吗？", "aliases": ["零德语", "英语授课"], "answer": "可以申请英语授课项目，前提是满足项目英语要求。但“能申请”与“在德国生活、实习和就业完全不需要德语”是两回事。若有长期留德计划，德语通常会扩大生活和就业选择。", "ask": ["目标专业是否有英授？", "毕业后计划留德吗？", "当前英语水平？"], "risk": "具体证书和分数以项目官网为准。", "tags": ["高频", "语言"], "src": "DAAD / 各高校官网"}, {"cat": "语言", "q": "德语要到什么水平才能申请？", "aliases": ["德语B2", "德语C1", "TestDaF多少"], "answer": "没有适用于所有项目的统一等级。德授项目通常要求较高德语水平，但接受的考试种类和最低成绩由学校/项目决定；英授项目通常看英语证明。", "ask": ["德授还是英授？", "具体学校和项目？", "已有何种语言成绩？"], "risk": "需要注意“必须C1”或“B2就够”。", "tags": ["高频", "语言", "必须查官网"], "src": "DAAD / 各高校官网"}, {"cat": "语言", "q": "TestDaF、DSH、telc C1 Hochschule怎么选？", "aliases": ["德福", "DSH", "telc Hochschule"], "answer": "三者都可能被德国高校接受，但各项目认可范围不完全一致。应先看目标项目认可哪些证书，再结合考试地点、时间、个人强弱项和出分周期决定。", "ask": ["目标学校认可哪些证书？", "希望何时出分？"], "risk": "语言证书认可范围以学校最新页面为准。", "tags": ["语言", "考试", "必须查官网"], "src": "各高校官网"}, {"cat": "语言", "q": "雅思/托福需要多少分？", "aliases": ["雅思多少", "托福多少"], "answer": "不同项目要求差异很大，有的还会规定单项、成绩有效期或是否接受其他英语证明。不存在“德国硕士统一雅思线”。", "ask": ["目标项目？", "当前分数？"], "risk": "直接查项目语言要求。", "tags": ["语言", "英语", "必须查官网"], "src": "各高校官网"}, {"cat": "语言", "q": "英语授课毕业后好找工作吗？", "aliases": ["英授就业", "不会德语找工作"], "answer": "授课语言本身不直接决定就业，但德语能力会影响可投岗位范围。IT、科研和国际化团队中英语岗位可能更多；大量本地企业、申请人沟通岗位和传统行业仍可能强烈要求德语。", "ask": ["什么专业？", "目标行业？", "是否留德？"], "risk": "英语授课并不等于毕业后一定能留德；不会德语也不代表一定无法就业。实际就业情况与专业、岗位、城市、实习经历及个人语言能力等因素有关。", "tags": ["就业", "语言", "真人判断"], "src": "Make it in Germany / 行业判断"}, {"cat": "语言", "q": "零基础学德语多久能达到留学水平？", "aliases": ["多久B2", "多久C1"], "answer": "没有可靠固定时长。学习强度、语言基础、目标考试和个人能力都会影响进度。更实用的是从目标入学季和考试日期倒推，并预留一次考试失利的缓冲。", "ask": ["目标入学时间？", "每周能投入多少时间？"], "risk": "需要注意“一年肯定C1”。", "tags": ["语言", "规划"], "src": "综合判断"}, {"cat": "语言", "q": "大学英语四六级可以申请英授吗？", "aliases": ["四六级"], "answer": "少数项目可能接受特定替代证明，但多数英授项目会明确列出IELTS/TOEFL等认可证明。是否接受四六级只能看项目官网。", "ask": ["目标项目？"], "risk": "不宜默认接受。", "tags": ["语言", "必须查官网"], "src": "各高校官网"}, {"cat": "语言", "q": "本科全英文授课可以免雅思吗？", "aliases": ["MOI", "英文授课证明"], "answer": "有些项目接受Medium of Instruction等英文授课证明，有些明确不接受。必须看目标项目的豁免条款。", "ask": ["目标项目？", "本科能否开MOI？"], "risk": "不同学校的具体规定可能不同，应逐校核查。", "tags": ["语言", "必须查官网"], "src": "各高校官网"}, {"cat": "语言", "q": "申请时语言没达标可以后补吗？", "aliases": ["语言后补"], "answer": "部分学校允许申请阶段先提交较低等级或在注册前补交，另一些必须在截止日期前满足。没有统一规则。", "ask": ["项目deadline？", "当前语言成绩？"], "risk": "不宜默认可以后补。", "tags": ["语言", "截止日期"], "src": "各高校官网"}, {"cat": "APS", "q": "APS是什么？", "aliases": ["审核部", "留德审核"], "answer": "APS是德国驻华大使馆文化处留德人员审核部。其核心工作包括审核中国申请人的学历材料真实性，并根据学历与教育经历判断其是否具备相应德国高校入学资格。不同申请人对应不同审核程序。", "ask": ["中国学历还是海外学历？", "申请本科/硕士/博士？", "是否已毕业？"], "risk": "不同学历背景和申请层次可能对应不同APS程序，办理前应先确认本人适用的审核类型。", "tags": ["高频", "APS"], "src": "APS官网"}, {"cat": "APS", "q": "中国学生申请德国都要APS吗？", "aliases": ["一定要APS吗", "谁免APS"], "answer": "多数以中国学历申请德国高校的中国申请人会涉及APS，但博士、特定奖学金、部分境外学历等存在不同情形或程序，不能只用国籍一句话判断。", "ask": ["申请层次？", "学历在哪里取得？", "是否奖学金/博士？"], "risk": "博士、奖学金及其他特殊情况可能适用不同APS程序，应以APS最新说明为准。", "tags": ["APS", "政策易变", "必须查官网"], "src": "APS官网"}, {"cat": "APS", "q": "APS一定要面谈吗？", "aliases": ["APS面试", "材料审核", "TestAS"], "answer": "不一定。APS有一般国内申请人、高考程序、材料审核、合作项目等不同程序；具体是否面谈或TestAS，要看个人学历和所属程序。", "ask": ["学历类型？", "目前在读还是毕业？", "属于哪种程序？"], "risk": "APS包含不同审核程序，并非所有申请人都需要参加同一种面谈或考试。", "tags": ["APS", "政策易变"], "src": "APS官网"}, {"cat": "APS", "q": "什么时候开始做APS最好？", "aliases": ["APS时间", "大几做APS"], "answer": "原则上尽早规划，因为APS可能是后续申请链条中的前置环节。目标是不要等学校申请截止前才开始处理。", "ask": ["现在大几？", "目标申请季？"], "risk": "2026年一般国内申请人程序有调整通知，使用时建议查看最新官方信息。", "tags": ["APS", "规划", "政策易变"], "src": "APS官网"}, {"cat": "APS", "q": "APS面谈主要考什么？", "aliases": ["APS怎么准备"], "answer": "核心不是单纯语言考试，而是围绕你的真实学习经历和专业课程，核验你是否确实完成了成绩单对应的学习内容。准备应围绕成绩单、核心课程、基本概念和课程之间的联系。", "ask": ["专业？", "成绩单核心课？"], "risk": "不宜仅用背模板替代对本人课程的理解。", "tags": ["APS", "面谈"], "src": "APS官网"}, {"cat": "APS", "q": "APS没过怎么办？", "aliases": ["APS失败", "再次面谈"], "answer": "先确认失败原因和所属程序，再查看APS关于再次面谈或后续流程的最新规定。准备重点应回到成绩单课程理解、表达和真实性。", "ask": ["第几次？", "收到什么通知？", "薄弱环节？"], "risk": "次数、间隔、费用等以APS最新通知为准。", "tags": ["APS", "政策易变"], "src": "APS官网"}, {"cat": "APS", "q": "APS证书有有效期吗？", "aliases": ["APS过期"], "answer": "不要凭旧经验回答。APS证书形式和流程近年有数字化调整，应根据个人程序和最新官方说明确认。", "ask": ["哪一年通过？", "哪种审核程序？"], "risk": "APS证书及程序相关规定可能调整，应以APS官网最新说明为准。", "tags": ["APS", "政策易变", "必须查官网"], "src": "APS官网"}, {"cat": "选校", "q": "TU、Uni、FH/HAW有什么区别？", "aliases": ["TU和FH", "应用科学大学"], "answer": "Universität/TU通常更偏学术与研究体系，TU常在工程技术领域较强；FH/HAW更强调应用、实践和行业连接。FH/HAW是德国正规高等教育机构，不能简单类比成中国大专。", "ask": ["以后想科研/博士还是就业？", "专业？", "是否重视实践？"], "risk": "不要做“TU一定比FH高级”的单一排序。", "tags": ["高频", "选校"], "src": "DAAD / Hochschulkompass"}, {"cat": "选校", "q": "FH毕业能正常找工作吗？", "aliases": ["FH就业"], "answer": "可以。就业更应看专业、实习、德语、项目经验、城市和岗位要求，而不是把FH身份本身当作“不能就业”。", "ask": ["目标行业？", "留德还是回国？", "是否考虑读博？"], "risk": "如果关心回国认知/排名，需要单独讨论。", "tags": ["选校", "就业"], "src": "DAAD / 综合判断"}, {"cat": "选校", "q": "德国大学怎么看排名？", "aliases": ["QS排名", "德国排名"], "answer": "排名可以是一个维度，但不应是唯一维度。留德就业时，专业匹配、课程、实习、德语和个人能力通常都很重要；若计划回国，学校国际知名度和排名可能更值得纳入决策。", "ask": ["毕业后留德还是回国？", "目标行业？"], "risk": "不宜简单认为“德国完全不看排名”，也用QS选校只是判断的一部分，还需结合其他相关因素。", "tags": ["高频", "选校", "决策"], "src": "DAAD / 综合判断"}, {"cat": "选校", "q": "TU9一定更好吗？", "aliases": ["TU9"], "answer": "TU9是九所技术大学组成的联盟，不等于所有专业都最适合你。选校应看具体课程、研究方向、城市、申请难度和职业目标。", "ask": ["具体专业？", "更看科研还是就业？"], "risk": "TU9等联盟身份可以作为学校特征之一，但不能代表具体专业一定更适合，也不能保证录取或就业结果。", "tags": ["选校", "TU9"], "src": "TU9 / 各高校官网"}, {"cat": "选校", "q": "学校越多越好吗？应该申请几所？", "aliases": ["申请几所", "海投"], "answer": "不是越多越好。更合理的是建立有梯度的申请池：冲刺、匹配、相对稳妥，并确保每个项目真的符合课程与语言要求。盲目海投会增加时间和错误率。", "ask": ["背景？", "目标专业？", "申请季时间？"], "risk": "需要注意所谓“保底校一定录”。", "tags": ["选校", "规划"], "src": "综合判断"}, {"cat": "选校", "q": "德国有没有真正的“保底校”？", "aliases": ["保底学校", "稳录"], "answer": "不建议使用“保底=一定录”的概念。可以做相对稳妥的梯度，但最终录取由高校决定。", "ask": ["项目是否限额？", "是否满足所有硬性条件？"], "risk": "德国高校最终录取由学校决定，不存在能够基于背景评估作出的绝对录取保证。", "tags": ["高频", "风险", "选校"], "src": "各高校官网"}, {"cat": "选校", "q": "小城市的德国大学值得去吗？", "aliases": ["小城市大学"], "answer": "值得与否取决于专业质量、研究/企业资源、生活成本和个人偏好。德国很多优质高校并不位于超大城市。", "ask": ["专业与就业目标？"], "risk": "不宜仅用城市大小代表学校质量。", "tags": ["选校", "城市"], "src": "综合判断"}, {"cat": "申请流程", "q": "德国大学一般怎么申请？", "aliases": ["怎么申请德国", "uni-assist"], "answer": "常见路径包括：直接在大学申请；通过uni-assist申请；或先由uni-assist出具VPD，再到大学自己的系统完成正式申请。必须以每个项目页面写明的申请入口为准。", "ask": ["本科还是硕士？", "目标学校？", "是否要求VPD？"], "risk": "不宜默认所有学校都走uni-assist。", "tags": ["高频", "申请流程"], "src": "uni-assist / 各高校官网"}, {"cat": "申请流程", "q": "VPD是什么？", "aliases": ["VPD预审", "uni assist VPD"], "answer": "VPD是uni-assist对申请人学历材料进行预审后出具的文件，通常包含学历评估等信息。要求VPD的项目一般还需要申请人拿到VPD后，在大学规定截止日期前再向大学完成正式申请。", "ask": ["目标学校是否要求VPD？", "大学端截止日期？"], "risk": "VPD通常只是学历预审文件；要求VPD的项目往往还需在大学系统中按时完成正式申请。", "tags": ["高频", "VPD"], "src": "uni-assist"}, {"cat": "申请流程", "q": "冬季学期和夏季学期什么时候截止？", "aliases": ["715", "115", "申请截止"], "answer": "7月15日和1月15日是很多项目常见截止日期，但绝不是德国所有项目统一deadline。硕士、国际项目、艺术设计项目等经常有更早或不同日期。", "ask": ["具体项目？", "Winter还是Sommer？"], "risk": "申请截止日期并非全国统一，应逐项目确认当年的具体截止时间。", "tags": ["高频", "截止日期", "必须查官网"], "src": "uni-assist / 各高校官网"}, {"cat": "申请流程", "q": "uni-assist处理要多久？", "aliases": ["UA多久", "处理周期"], "answer": "uni-assist官方通常给出约4–6周的常规评估时间，并建议提前提交。申请高峰期、材料来源和个案情况都会影响速度。", "ask": ["大学截止日期？", "何时提交UA？"], "risk": "使用时看uni-assist当前Processing Time页面。", "tags": ["政策易变", "uni-assist", "时间"], "src": "uni-assist"}, {"cat": "申请流程", "q": "申请德国硕士一般需要哪些材料？", "aliases": ["申请材料", "材料清单"], "answer": "常见会涉及学历/在读证明、成绩单、语言证明、APS（适用时）、简历、动机信等；部分专业还会要求作品集、GRE/GMAT、课程描述、推荐信或特定表格。真正清单以项目官方要求为准。", "ask": ["具体项目？", "是否通过uni-assist？"], "risk": "不宜直接沿用通用清单套所有学校。", "tags": ["高频", "材料"], "src": "uni-assist / 各高校官网"}, {"cat": "申请流程", "q": "动机信重要吗？", "aliases": ["Motivation Letter", "SOP"], "answer": "重要程度因项目而异。有的明确纳入评分，有的只是形式材料，有的甚至不要求。重点应是与项目匹配的学术/职业动机。", "ask": ["项目是否评分动机信？", "有哪些直接相关经历？"], "risk": "不要虚构经历。", "tags": ["材料", "动机信"], "src": "各高校官网"}, {"cat": "申请流程", "q": "推荐信必须要吗？", "aliases": ["推荐信"], "answer": "不是所有德国硕士都要求推荐信。是否需要、几封、谁可以推荐，都由具体项目规定。", "ask": ["目标项目材料列表？"], "risk": "项目没要求时不要为了“显得厉害”乱加材料。", "tags": ["材料"], "src": "各高校官网"}, {"cat": "申请流程", "q": "课程描述/Module Handbook怎么准备？", "aliases": ["课程描述", "模块手册"], "answer": "如果项目要求证明先修课程或学分，课程描述很关键。应尽量使用学校官方课程大纲、培养方案、module description等可核实材料，并清晰对应课程名称、内容、学分和学时。", "ask": ["目标项目要求哪些课程？", "本科能否开官方课程描述？"], "risk": "课程描述应尽量依据学校官方培养方案、课程大纲或可核实材料，准确呈现课程内容与学分。", "tags": ["课程匹配", "材料", "高价值"], "src": "各高校官网"}, {"cat": "申请流程", "q": "申请材料需要公证/翻译吗？", "aliases": ["公证", "翻译", "认证"], "answer": "是否需要认证副本、由谁翻译、接受哪些语言和提交形式，取决于uni-assist或具体高校要求。先看提交渠道的材料规范。", "ask": ["通过谁申请？", "原件语言？"], "risk": "不宜默认所有材料都必须公证。", "tags": ["材料", "必须查官网"], "src": "uni-assist / 各高校官网"}, {"cat": "申请流程", "q": "Anabin是什么？", "aliases": ["学历数据库"], "answer": "Anabin是德国用于查询外国教育资格/机构信息的重要官方数据库之一，但具体申请是否需要你自行查Anabin取决于用途。留学申请时不宜仅用它替代大学或APS的最终判断。", "ask": ["你查的是学校资格、学历还是签证用途？"], "risk": "不宜仅用数据库截图代替项目正式资格判断。", "tags": ["学历", "工具"], "src": "Anabin / ZAB"}, {"cat": "申请流程", "q": "Hochschulkompass是什么？", "aliases": ["大学专业搜索"], "answer": "Hochschulkompass是德国高校校长联席会议提供的高校与专业信息入口，可用于查正规高校和项目，但最终申请要求仍应回到学校官网。", "ask": ["想查学校还是专业？"], "risk": "Hochschulkompass适合检索高校与专业信息，具体录取要求仍应回到学校官网核对。", "tags": ["工具", "选校"], "src": "Hochschulkompass"}, {"cat": "申请流程", "q": "DAAD数据库可以直接当最终申请要求吗？", "aliases": ["DAAD专业库"], "answer": "DAAD很适合做项目发现和初筛，但申请截止、语言、材料和资格要求应再回到大学项目官网核对。", "ask": ["具体项目链接？"], "risk": "DAAD等聚合数据库适合初筛项目，截止日期、语言和材料要求仍应以大学官网为准。", "tags": ["工具", "必须查官网"], "src": "DAAD"}, {"cat": "申请流程", "q": "学校官网是德语，看不懂怎么办？", "aliases": ["官网德语"], "answer": "优先找 Admission/Zulassung、Bewerbung/Application、Zulassungsordnung、Sprachnachweis、Fristen 等页面。翻译工具可辅助，但关键条款应保留原文核对。", "ask": ["具体页面？"], "risk": "第三方攻略可辅助理解，但涉及录取、截止日期和材料要求时应优先核对高校官方原文。", "tags": ["工具", "高频"], "src": "各高校官网"}, {"cat": "申请流程", "q": "申请德国需要GRE吗？", "aliases": ["GRE"], "answer": "只有部分项目要求或推荐GRE，尤其某些理工、经济或国际项目。是否需要必须看项目官网。", "ask": ["目标项目？"], "risk": "不宜默认德国不看GRE。", "tags": ["GRE", "材料"], "src": "各高校官网"}, {"cat": "申请流程", "q": "申请德国需要GMAT吗？", "aliases": ["GMAT"], "answer": "部分商科项目会要求或推荐GMAT/GRE，但并非统一要求。", "ask": ["目标项目？"], "risk": "不同学校的具体规定可能不同，应逐校核查。", "tags": ["GMAT", "商科"], "src": "各高校官网"}, {"cat": "费用", "q": "德国留学是不是免学费？", "aliases": ["免学费", "德国大学免费"], "answer": "不能说“德国大学全部免费”。很多公立项目不收传统意义上的高额学费，但通常有Semesterbeitrag；部分州、学校、国际学生身份或特定硕士项目可能收学费。", "ask": ["哪所学校/哪个州？", "本科还是硕士？"], "risk": "费用政策会变，具体项目实时核查。", "tags": ["高频", "费用", "政策易变"], "src": "DAAD / 各高校官网"}, {"cat": "费用", "q": "德国留学一年大概要多少钱？", "aliases": ["一年多少钱", "预算"], "answer": "建议拆开估算：住房、医保、饮食、交通、Semesterbeitrag、可能的学费、通信、日常开支和初期安置成本。城市差异很大。", "ask": ["城市？", "是否有学费？", "预算上限？"], "risk": "签证资金证明不等于真实生活费。", "tags": ["高频", "费用", "决策"], "src": "Make it in Germany / DAAD"}, {"cat": "费用", "q": "2026年德国学生签证需要多少资金证明？", "aliases": ["保证金", "冻结账户", "Blocked Account"], "answer": "德国官方 Make it in Germany 当前列出的2026年学生签证生活资金证明标准为至少11,904欧元。可通过冻结账户、奖学金或符合条件的担保等方式证明；正式签证仍以使领馆最新要求为准。", "ask": ["申请哪类学生签证？", "是否已有奖学金或担保？"], "risk": "政策数字易变，使用时建议查看最新官方信息德国官方签证页面。", "tags": ["政策易变", "签证", "费用", "2026"], "src": "Make it in Germany"}, {"cat": "费用", "q": "Semesterbeitrag是什么？", "aliases": ["学期费"], "answer": "Semesterbeitrag通常是学生每学期缴纳的学期杂费/贡献，可能覆盖学生服务、学生会及部分交通等内容，不等同于学费。金额和包含项目由学校/地区决定。", "ask": ["哪所学校？"], "risk": "Semesterbeitrag金额及包含内容因学校和地区而异，应查看学校当期收费信息。", "tags": ["费用"], "src": "各高校官网"}, {"cat": "费用", "q": "可以靠打工覆盖德国留学生活费吗？", "aliases": ["打工养活自己"], "answer": "不建议把“靠打工完全覆盖生活费”当作留学前提。学生工作受时间规则、岗位、德语能力、课业强度和城市就业情况影响；签证阶段本身也要求提前证明资金能力。", "ask": ["专业和德语水平？", "预算缺口？"], "risk": "学生兼职收入具有不确定性，不宜作为覆盖全部留学费用的唯一资金来源。", "tags": ["费用", "打工", "决策"], "src": "Make it in Germany"}, {"cat": "费用", "q": "巴登-符腾堡州还收国际学生学费吗？", "aliases": ["巴符州学费"], "answer": "这是州级收费政策问题，且存在豁免和例外。答具体申请人时应直接查目标大学当年 International Tuition Fees 页面，不要靠记忆。", "ask": ["哪所大学？", "国籍/身份？"], "risk": "相关政策和收费标准可能调整，应以当期官方信息为准。", "tags": ["费用", "政策易变"], "src": "目标大学 / 州政府"}, {"cat": "签证与居留", "q": "德国留学生在读期间可以打工吗？", "aliases": ["学生打工", "140天", "280天", "20小时"], "answer": "可以。德国官方当前说明：第三国学生通常可每年工作140个全天或280个半天；也存在按每周20小时计算的规则。学生助理等情形可能有特殊处理。", "ask": ["当前持什么居留？", "普通兼职还是学生助理？"], "risk": "政策易变；不宜直接沿用旧的120/240天规则回答2026申请人。", "tags": ["高频", "政策易变", "打工", "2026"], "src": "Make it in Germany"}, {"cat": "签证与居留", "q": "德国毕业后可以留多久找工作？", "aliases": ["18个月", "毕业找工作"], "answer": "从德国高校成功毕业后，符合条件的国际毕业生可申请最长18个月的求职居留，用于寻找符合条件的工作。", "ask": ["是否德国高校毕业？", "当前居留类型？"], "risk": "办理毕业后求职居留时，应以当地外管局及德国官方最新规定为准。", "tags": ["高频", "就业", "居留", "政策易变"], "src": "Make it in Germany"}, {"cat": "签证与居留", "q": "拿到录取以后签证怎么准备？", "aliases": ["学生签证"], "answer": "通常需要围绕录取/学习目的、资金证明、保险、护照和使领馆要求材料准备。不同申请地和个人情况可能有差异，应直接依据德国驻华使领馆当前学生签证清单。", "ask": ["正式录取还是条件录取？", "资金证明准备了吗？"], "risk": "签证材料必须以官方最新清单为准。", "tags": ["签证", "必须查官网", "政策易变"], "src": "德国驻华使领馆 / Make it in Germany"}, {"cat": "签证与居留", "q": "条件录取可以办签证吗？", "aliases": ["conditional admission", "条件zu"], "answer": "需要看条件录取的具体性质、尚未满足的条件以及签证类别要求。不能只看到“录取”两个字就判断一定能办。", "ask": ["条件是什么？", "是否还需语言班/考试？"], "risk": "条件录取能否用于相应签证申请取决于具体条件和签证类型，应以使领馆最新要求为准。", "tags": ["签证", "必须查官网"], "src": "德国驻华使领馆"}, {"cat": "签证与居留", "q": "学生签证能带家属吗？", "aliases": ["配偶", "家属团聚"], "answer": "家庭团聚涉及婚姻关系、居留类型、生活保障、住房等条件，不能用普通留学经验一句话回答。应依据德国外交部/当地外管局当前规定核查。", "ask": ["配偶/子女？", "当前或计划持什么居留？"], "risk": "属于居留政策，必须查官方。", "tags": ["签证", "家庭", "必须查官网"], "src": "德国外交部 / 当地外管局"}, {"cat": "就业", "q": "德国毕业以后好找工作吗？", "aliases": ["德国就业", "留德工作"], "answer": "不能脱离专业和语言回答。就业要同时看行业需求、学历层次、德语水平、实习/项目经历、城市、签证身份和当期经济环境。", "ask": ["专业？", "德语水平？", "有无德国实习？", "目标城市/岗位？"], "risk": "不宜仅用“德国缺人所以很好找”这种泛化结论。", "tags": ["高频", "就业", "真人判断"], "src": "Make it in Germany / BA / 实时招聘"}, {"cat": "就业", "q": "不会德语能在德国找到工作吗？", "aliases": ["英语工作", "无德语就业"], "answer": "有可能，但岗位范围明显依行业而不同。国际化IT、科研、部分工程和跨国企业可能有英语岗位；大量本地企业、申请人沟通岗位和传统行业仍可能强烈要求德语。", "ask": ["专业/岗位？", "目标公司类型？", "德语水平？"], "risk": "最好结合当期真实招聘广告判断。", "tags": ["就业", "语言", "高频"], "src": "实时招聘 / Make it in Germany"}, {"cat": "就业", "q": "哪些专业在德国更容易就业？", "aliases": ["好就业专业", "德国缺人专业"], "answer": "不建议只按“缺人榜”选专业。就业需求会变化，而且能否申请、能否读完、语言要求和个人能力同样关键。可以用官方紧缺职业、招聘数量和行业报告作参考，再结合本科背景。", "ask": ["本科专业？", "是否愿意转相邻方向？", "德语水平？"], "risk": "动态市场信息应实时查。", "tags": ["就业", "专业选择", "政策易变"], "src": "Bundesagentur für Arbeit / Make it in Germany"}, {"cat": "就业", "q": "德国硕士毕业工资大概多少？", "aliases": ["德国工资", "起薪"], "answer": "必须按行业、城市、岗位、公司规模和经验拆开看。不要给“德国硕士统一起薪”。最有效的方式是查目标岗位当期薪资和税前/税后差异。", "ask": ["专业和目标岗位？", "城市？", "税前还是税后？"], "risk": "薪资受行业、城市、岗位、公司规模和经验影响明显，宜参考当期岗位和薪酬数据。", "tags": ["就业", "薪资", "动态信息"], "src": "BA / 薪酬平台"}, {"cat": "就业", "q": "德国实习重要吗？", "aliases": ["Praktikum", "Werkstudent"], "answer": "如果计划留德就业，德国本地实习/Werkstudent经历通常很有价值，可以帮助了解职场、积累本地经历、提高德语并获得转正机会。", "ask": ["专业？", "课程是否有Pflichtpraktikum？", "德语水平？"], "risk": "实习对就业的作用因专业和目标岗位而异，应结合具体职业路径判断。", "tags": ["就业", "实习"], "src": "Make it in Germany / 各高校"}, {"cat": "就业", "q": "Werkstudent是什么？", "aliases": ["学生工"], "answer": "Werkstudent通常指在读大学生以学生身份在企业从事与学习并行的工作，是德国学生积累本地经验的常见方式。工时、社保和居留规则要按个人情况确认。", "ask": ["是否在读？", "岗位性质？"], "risk": "Werkstudent、普通兼职和实习在身份、合同及规则上有所区别，应根据实际岗位判断。", "tags": ["就业", "实习"], "src": "Make it in Germany / 雇佣规则"}, {"cat": "就业", "q": "回国就业德国学历认可吗？", "aliases": ["回国认可"], "answer": "应区分“学历是否可认证”与“雇主是否认可学校/专业”。学历认证看中国教育部留学服务中心当前规则，雇主偏好则因行业不同。", "ask": ["目标学校和学位？", "回国行业？"], "risk": "回国学历认证应依据中国教育部留学服务中心当期规则办理。", "tags": ["回国", "必须查官网"], "src": "中国教育部留学服务中心"}, {"cat": "本科申请", "q": "中国高中毕业可以直接申请德国本科吗？", "aliases": ["高考申请德国", "本科直申"], "answer": "是否能直接申请取决于高考成绩、学历路径和目标专业等条件。中国申请人还涉及APS高考程序。应先用APS/DAAD当前规则确认德国高校入学资格。", "ask": ["高考年份与成绩？", "目标专业？"], "risk": "本科入学资格规则细且可能调整。", "tags": ["本科", "APS", "必须查官网"], "src": "APS / DAAD"}, {"cat": "本科申请", "q": "高考多少分可以申请德国本科？", "aliases": ["高考60%", "高考70%"], "answer": "APS目前按不同条件列有高考程序说明，包括不同高考成绩门槛情形，但能否直入某专业还涉及具体条件。报一个百分比就结束只是判断的一部分，还需结合其他相关因素。", "ask": ["高考总分与本人分数？", "目标专业？"], "risk": "2026规则以APS高考程序最新文件为准。", "tags": ["本科", "APS", "政策易变"], "src": "APS官网"}, {"cat": "本科申请", "q": "德国本科一般读几年？", "aliases": ["Bachelor几年"], "answer": "很多德国Bachelor标准学制为6个学期，也有7或8学期项目。实际毕业时间还取决于课程安排、实习和个人进度。", "ask": ["具体专业/学校？"], "risk": "标准学制等同于实际毕业时长之间不能简单画等号，应结合具体情况理解。", "tags": ["本科"], "src": "各高校官网"}, {"cat": "本科申请", "q": "德国本科可以转学吗？", "aliases": ["转学德国"], "answer": "可能存在高年级申请或学分认可，但是否能认多少学分、从第几学期开始，由目标高校/学院审核。", "ask": ["已完成哪些课程？", "目标是否同专业？"], "risk": "转学或高年级申请时，可认可的课程和学分由目标高校最终审核决定。", "tags": ["本科", "学分"], "src": "各高校官网"}, {"cat": "本科申请", "q": "德国本科有英语授课吗？", "aliases": ["英授本科"], "answer": "有英语授课本科，但数量和专业分布与硕士不同。应在DAAD/Hochschulkompass筛选后回到学校官网核对。", "ask": ["目标专业？"], "risk": "不宜默认所有专业都有英授本科。", "tags": ["本科", "语言"], "src": "DAAD / Hochschulkompass"}, {"cat": "硕士申请", "q": "德国硕士一般读几年？", "aliases": ["Master几年"], "answer": "很多硕士为3–4个学期，但具体项目可能不同。实际完成时间还受论文、实习、课程和个人节奏影响。", "ask": ["具体项目？"], "risk": "需要注意两年一定毕业。", "tags": ["硕士"], "src": "各高校官网"}, {"cat": "硕士申请", "q": "德国硕士是申请制还是考试制？", "aliases": ["考研德国"], "answer": "多数项目以材料申请和资格审核为核心，但部分专业可能有面试、入学考试、作品集、能力测试或其他选拔。", "ask": ["专业和学校？"], "risk": "艺术、建筑和设计类项目可能包含作品集、能力测试或面试，应查看目标项目的具体选拔方式。", "tags": ["硕士", "申请流程"], "src": "各高校官网"}, {"cat": "硕士申请", "q": "德国硕士有NC是什么意思？", "aliases": ["NC", "Numerus Clausus"], "answer": "NC通常表示招生名额受限，录取会在符合基本资格的申请人中进一步竞争。具体排名依据和分数线不是全国统一，历史分数也不能保证下一届结果。", "ask": ["项目录取条例？"], "risk": "往年NC值当今年保证线之间不能简单画等号，应结合具体情况理解。", "tags": ["硕士", "录取"], "src": "各高校官网"}, {"cat": "硕士申请", "q": "本科专业名称不一样，但课程很像，可以申吗？", "aliases": ["课程匹配"], "answer": "可能可以。德国硕士审核经常更关注你实际修过的模块和学分，而不只看专业中文名称。课程描述、Module Handbook和学分对应会很关键。", "ask": ["目标项目要求哪些ECTS？", "本科课程能否逐项对应？"], "risk": "本科课程与目标硕士是否构成足够的专业匹配，由目标高校依据其录取规则最终认定。", "tags": ["硕士", "课程匹配", "高价值"], "src": "各高校官网"}, {"cat": "硕士申请", "q": "ECTS是什么？", "aliases": ["学分"], "answer": "ECTS是欧洲学分体系。很多德国硕士会用ECTS明确要求本科阶段修过多少数学、计算机、经济学等模块。中国成绩单学分不能总是按1:1自行换算。", "ask": ["目标项目要求多少ECTS？", "本科课程学分怎么标？"], "risk": "中国高校学分与ECTS之间不一定存在统一的1:1换算关系，具体认定方式以目标高校为准。", "tags": ["课程匹配", "高频"], "src": "各高校官网"}, {"cat": "硕士申请", "q": "180 ECTS和210 ECTS有什么影响？", "aliases": ["180 ECTS", "210 ECTS"], "answer": "部分硕士会要求申请人本科达到180或210 ECTS等总量；不足时有些项目可通过补课/额外学分弥补，有些不能。具体规则看项目。", "ask": ["本科学制几年？", "目标项目要求？"], "risk": "本科总学分要求及不足学分的处理方式因项目而异，应逐项目确认。", "tags": ["硕士", "课程匹配"], "src": "各高校官网"}, {"cat": "硕士申请", "q": "三年制本科能申德国硕士吗？", "aliases": ["三年本科"], "answer": "要看学历是否被认可、总学分和目标项目的入学资格，不能只按“三年”判断。", "ask": ["本科国家/学校/学位？", "目标项目？"], "risk": "三年制本科等学历路径的申请资格需结合学历认可、总学分及目标项目要求具体核查。", "tags": ["学历", "必须查官网"], "src": "DAAD / 各高校"}, {"cat": "硕士申请", "q": "德国硕士看科研/论文吗？", "aliases": ["论文重要吗", "科研经历"], "answer": "取决于项目。研究型项目可能更看重科研匹配，但很多授课型硕士首先检查硬性学术资格、课程和成绩。科研不能替代缺失的必修学分。", "ask": ["项目偏研究还是应用？"], "risk": "科研和论文的重要程度因项目而异，是否构成优势取决于项目定位及与研究方向的匹配度。", "tags": ["硕士", "科研"], "src": "各高校官网"}, {"cat": "专业要求", "q": "计算机申请德国硕士最看什么？", "aliases": ["CS德国", "计算机申请"], "answer": "通常重点看本科核心课程和学分，例如数学、编程、算法、数据结构、理论计算机、系统等；不同项目要求差异很大。", "ask": ["课程表和学分？", "目标CS、Data Science还是AI？"], "risk": "不能只凭“本科是计算机”判断所有CS项目都匹配。", "tags": ["计算机", "课程匹配"], "src": "各高校官网"}, {"cat": "专业要求", "q": "机械/车辆工程申请德国怎么样？", "aliases": ["机械德国", "车辆工程"], "answer": "相关项目选择较多，但申请仍需看课程匹配、语言和项目方向。就业端也应结合当前汽车产业与制造业招聘情况实时判断。", "ask": ["机械、车辆、自动化还是生产？", "德语水平？"], "risk": "就业情况属于动态信息。", "tags": ["工科", "就业"], "src": "各高校官网 / 实时招聘"}, {"cat": "专业要求", "q": "商科申请德国最看什么？", "aliases": ["商科德国", "金融德国"], "answer": "先区分Business/Management、Finance、Economics等方向。很多项目对经济、数学、统计和方法课程的ECTS要求很具体，部分还可能要求GMAT/GRE。", "ask": ["本科课程和学分？", "目标细分方向？"], "risk": "商科差异很大。", "tags": ["商科", "课程匹配"], "src": "各高校官网"}, {"cat": "专业要求", "q": "心理学可以申请德国硕士吗？", "aliases": ["心理学德国"], "answer": "心理学在德国往往对本科课程结构和学分匹配要求较细，部分项目竞争激烈。若目标涉及临床/执业，还需区分学术硕士与受监管职业资格路径。", "ask": ["本科是否心理学？", "目标科研还是执业？"], "risk": "涉及受监管职业时必须查官方。", "tags": ["心理学", "必须查官网"], "src": "各高校官网 / 职业资格官方"}, {"cat": "专业要求", "q": "医学可以去德国读硕士吗？", "aliases": ["医学留德", "临床医学"], "answer": "先区分“医学相关Master”与“在德国成为执业医生”是两条不同路径。临床执业涉及国家考试、学历认可和行医许可等监管要求。", "ask": ["目标是科研型Master还是临床执业？"], "risk": "医疗职业资格必须查德国官方认可机构。", "tags": ["医学", "受监管职业", "必须查官网"], "src": "Anerkennung in Deutschland / 各高校"}, {"cat": "专业要求", "q": "法学可以去德国读硕士吗？", "aliases": ["法律德国", "LLM"], "answer": "可以有LL.M.等项目，但“读一个法律硕士”与“取得德国本地传统法律职业资格”不是同一回事。先明确职业目标。", "ask": ["想读LLM还是德国执业？"], "risk": "若目标是在德国从事受监管法律职业，需要另行核查相应国家考试及职业资格规定。", "tags": ["法律", "受监管职业"], "src": "各高校官网 / 德国官方"}, {"cat": "艺术与设计", "q": "建筑/设计类申请德国一定要作品集吗？", "aliases": ["作品集", "portfolio"], "answer": "很多建筑、设计、艺术项目会要求作品集或能力测试，但并非所有项目相同。页数、尺寸、文件大小、项目类型和提交平台都可能严格规定。", "ask": ["具体学校/项目？", "作品集要求原文？"], "risk": "作品集格式必须不同学校的具体规定可能不同，应逐校核查。", "tags": ["设计", "作品集", "必须查官网"], "src": "各高校官网"}, {"cat": "艺术与设计", "q": "作品集是项目越多越好吗？", "aliases": ["作品集项目数"], "answer": "不是。核心是展示与你申请方向相关的能力、思考过程和表达质量。项目数量应服从学校限制和整体叙事。", "ask": ["目标专业？", "学校页数限制？"], "risk": "先满足硬性格式，再谈审美。", "tags": ["设计", "作品集", "真人判断"], "src": "各高校官网 / 专业判断"}, {"cat": "奖学金", "q": "德国留学有哪些奖学金？", "aliases": ["DAAD奖学金"], "answer": "常见信息入口包括DAAD奖学金数据库、学校奖学金、基金会和部分专业/项目奖学金。资格、截止日期和材料要求差异很大。", "ask": ["本科/硕士/博士？", "专业？", "目标入学时间？"], "risk": "每年项目和截止日期会变，应实时查。", "tags": ["奖学金", "动态信息"], "src": "DAAD"}, {"cat": "生活准备", "q": "德国留学生必须买保险吗？", "aliases": ["医保", "Krankenversicherung"], "answer": "在德国学习通常需要满足健康保险要求，注册大学时也会涉及相应证明。公保/私保选择和适用条件与年龄、身份等有关。", "ask": ["年龄？", "本科/硕士/语言班？"], "risk": "健康保险的适用条件和后续影响与年龄、身份等有关，选择时除价格外还应关注保障范围和注册要求。", "tags": ["生活", "保险", "必须查官网"], "src": "学校 / 德国医保官方"}, {"cat": "生活准备", "q": "德国学生宿舍好申请吗？", "aliases": ["宿舍", "Studentenwerk"], "answer": "因城市和学校差异很大，热门城市常常供不应求。建议尽早查看当地Studierendenwerk宿舍规则，同时准备WG和私租备选。", "ask": ["城市？", "学校？", "预计入住时间？"], "risk": "名额和等待时间是动态信息。", "tags": ["生活", "住房"], "src": "当地Studierendenwerk"}, {"cat": "生活准备", "q": "德国租房需要注意什么？", "aliases": ["WG", "租房骗局"], "answer": "重点核对房东/转租身份、合同、押金、Nebenkosten、是否可Anmeldung、入住时间和付款方式。远程租房尤其警惕无法验证身份却要求异常转账。", "ask": ["WG还是整租？", "是否能Anmeldung？"], "risk": "遇到异常付款要求提高警惕。", "tags": ["生活", "租房"], "src": "当地消费者保护信息"}, {"cat": "生活准备", "q": "Anmeldung是什么？", "aliases": ["住址登记"], "answer": "Anmeldung是德国居住地址登记，通常是落地后的重要行政事项之一，会影响后续银行、税号、居留等流程。具体预约和材料看当地Bürgeramt。", "ask": ["哪个城市？"], "risk": "Anmeldung的预约方式、材料和办理流程因城市而异，应查看当地Bürgeramt说明。", "tags": ["生活", "落地"], "src": "当地Bürgeramt"}, {"cat": "国家与路径选择", "q": "德国和英国留学怎么选？", "aliases": ["德国英国", "英德对比"], "answer": "从德国一侧重点比较：项目学制、学费与生活成本、语言成本、申请专业匹配限制、毕业后就业路径，以及是否愿意长期学习德语。英国最新政策需要单独实时核查。", "ask": ["预算？", "专业？", "毕业后想去哪工作？"], "risk": "不熟悉的英国最新政策不要凭旧信息比较。", "tags": ["决策", "国家选择"], "src": "德国官方 + 对方国家实时信息"}, {"cat": "国家与路径选择", "q": "德国读研和国内考研怎么选？", "aliases": ["考研还是留学"], "answer": "这是机会成本题。比较准备周期、录取不确定性、预算、语言、专业匹配、职业目标、家庭接受度以及毕业后想在哪个就业市场发展。", "ask": ["国内可选学校？", "德国目标？", "预算？"], "risk": "留学包装成逃避考研的简单路线之间不能简单画等号，应结合具体情况理解。", "tags": ["决策", "真人判断"], "src": "综合判断"}, {"cat": "国家与路径选择", "q": "德国适合完全不想学德语的人吗？", "aliases": ["不学德语"], "answer": "如果只读英授并短期体验，有可能；如果希望长期生活、实习和留德就业，完全拒绝学德语会缩小选择。", "ask": ["留德还是回国？"], "risk": "讲机会成本，不做道德判断。", "tags": ["决策", "语言"], "src": "综合判断"}, {"cat": "录取与注册", "q": "拿到多个录取怎么选？", "aliases": ["多个offer", "选offer"], "answer": "建议用同一套权重比较：课程匹配、职业方向、城市与实习、语言环境、费用、学校资源和个人偏好。按排名只是判断的一部分，还需结合其他相关因素。", "ask": ["每个项目课程？", "毕业目标？", "预算？"], "risk": "这是很适合升级深度规划的决策题。", "tags": ["录取", "决策", ""], "src": "综合判断"}, {"cat": "录取与注册", "q": "录取了可以延期入学吗？", "aliases": ["defer", "延期入学"], "answer": "德国高校是否允许延期没有统一规则。很多项目需要下一学期重新申请，也有个别可延期。必须直接看录取信和学院规定。", "ask": ["哪所学校/项目？"], "risk": "德国高校的延期入学规则与其他国家并不统一，应以录取信和目标高校规定为准。", "tags": ["录取", "必须查官网"], "src": "各高校官网"}, {"cat": "录取与注册", "q": "什么是Immatrikulation？", "aliases": ["注册", "入学注册"], "answer": "Immatrikulation是正式注册成为大学学生的过程。拿到录取不等于已经注册，通常还需在期限内提交保险、学历、缴费等材料。", "ask": ["注册deadline？", "还缺哪些材料？"], "risk": "录取后仍需关注正式注册期限及材料要求，逾期可能影响当学期入学。", "tags": ["录取", "注册"], "src": "各高校官网"}, {"cat": "咨询边界", "q": "你能保证我申请到德国大学吗？", "aliases": ["保录", "保证录取"], "answer": "不能。可以根据背景、项目官方要求和申请策略做判断、筛选和规划，但最终录取由德国高校决定。", "ask": ["申请人真正担心资格、选校还是竞争力？"], "risk": "最终录取结果由德国高校决定，任何背景评估或申请策略都不能等同于录取保证。", "tags": ["常见问题", "风险"], "src": "高校录取规则"}, {"cat": "咨询边界", "q": "能不能直接帮我选10所学校？", "aliases": ["99选校", "帮选学校"], "answer": "建议定位为快速判断和问题澄清：可以判断方向、解释规则、指出下一步，但不包含系统逐校核查和完整申请池。逐项目核对课程、语言、deadline并形成梯度，属于深度规划。", "ask": ["先明确最核心的1–3个问题。"], "risk": "守住使用说明。", "tags": ["常见问题", "使用说明", ""], "src": "使用说明"},      {"cat": "常见误区", "q": "德国大学是不是很难毕业？", "aliases": ["德国毕业难", "延毕"], "answer": "“德国都很难毕业”是过度概括。不同专业、学校和个人准备差异很大。需要看课程考核方式、语言、专业基础、重考规则和个人学习节奏。", "ask": ["什么专业？", "德语/英语水平？"], "risk": "不同学校、专业和个人学习情况差异明显，个体体验不能代表所有德国高校。", "tags": ["误区", "决策"], "src": "各高校课程规则 / 经验参考"}, {"cat": "常见误区", "q": "德国大学是不是宽进严出？", "aliases": ["宽进严出"], "answer": "不能一概而论。有些本科项目入学门槛相对开放但课程淘汰明显；很多硕士项目本身录取就相当严格。", "ask": ["本科还是硕士？", "什么专业？"], "risk": "德国高校的入学门槛和毕业难度因项目而异，“宽进严出”并不能概括所有情况。", "tags": ["误区"], "src": "各高校官网"}, {"cat": "常见误区", "q": "德国大学没有学费，所以读书成本很低？", "aliases": ["德国便宜", "免费留学"], "answer": "学费只是总成本的一部分。住房、保险、生活、交通、Semesterbeitrag和机会成本都需要算，热门城市住房可能成为最大支出。", "ask": ["城市？", "项目是否收费？", "预算？"], "risk": "评估德国留学成本时还应同时考虑住房、保险、生活费、学期杂费和时间成本。", "tags": ["误区", "费用"], "src": "DAAD / 学校费用"}, {"cat": "常见误区", "q": "德国留学一定要找中介吗？", "aliases": ["要不要中介", "自己申请"], "answer": "不一定。德国多数项目可以自己完成申请，官方信息也公开。咨询价值更多在复杂学历、跨专业、选校判断、时间规划和材料策略，而不是替申请人点击提交按钮。", "ask": ["申请人卡在哪一步？"], "risk": "不要制造“没中介就申不了”的焦虑。", "tags": ["误区", "信任"], "src": "uni-assist / 各高校官网"}, {"cat": "常见误区", "q": "德国毕业就能拿永居吗？", "aliases": ["永居", "移民德国"], "answer": "不是。毕业后可按条件申请求职居留，之后还需满足相应就业、居留和其他法律条件，才可能进入长期居留/永居路径。", "ask": ["申请人问的是求职居留、工作居留还是永居？"], "risk": "长期居留及永居条件可能随法律政策变化，应以德国官方移民与居留规定为准。", "tags": ["居留", "政策易变", "误区"], "src": "Make it in Germany"}];
const SOURCES={"DAAD": "https://www.daad.de/en/studying-in-germany/requirements/overview/", "uni-assist": "https://www.uni-assist.de/en/", "APS官网": "https://www.aps.org.cn/zh/verfahren-und-services-deutschland", "Make it in Germany": "https://www.make-it-in-germany.com/en/visa-residence/types/studying", "Hochschulkompass": "https://www.hochschulkompass.de/en/study-in-germany.html", "Anabin / ZAB": "https://anabin.kmk.org/anabin.html", "中国教育部留学服务中心": "https://www.cscse.edu.cn/"};
let cat='全部', policyOnly=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function norm(s){return String(s||'').toLowerCase().replace(/\s+/g,'')}
function hit(x,k){return !k||norm([x.q,...x.aliases,x.answer,x.cat,...x.tags].join(' ')).includes(norm(k))}
function render(){
 const k=$('#search').value.trim();
 let rows=DATA.filter(x=>(cat==='全部'||x.cat===cat)&&(!policyOnly||x.tags.includes('政策易变'))&&hit(x,k));
 $('#count').textContent=`显示 ${rows.length} / ${DATA.length} 个问题`;
 $('#grid').innerHTML=rows.length?rows.map((x,i)=>{
   let chips=x.tags.map(t=>`<span class="chip ${t==='政策易变'||t==='必须查官网'?'warn':''}">${esc(t)}</span>`).join('');
   let asks=x.ask.length?`<div class="section"><div class="label">继续追问申请人</div><ul class="ask">${x.ask.map(a=>`<li>${esc(a)}</li>`).join('')}</ul></div>`:'';
   let sUrl=Object.entries(SOURCES).find(([name])=>x.src.includes(name));
   let source=sUrl?`<a href="${sUrl[1]}" target="_blank" rel="noopener">${esc(x.src)}</a>`:esc(x.src);
   return `<article class="card" data-q="${esc(x.q)}"><div class="head" onclick="this.parentElement.classList.toggle('open')"><div class="cat">${esc(x.cat)}</div><div class="q">${esc(x.q)}</div><div class="chips">${chips}</div></div><div class="body"><div class="section"><div class="label">参考解答</div><div class="ans">${esc(x.answer)}</div></div>${asks}<div class="section"><div class="label">需要注意</div><div class="risk">${esc(x.risk)}</div></div><div class="section sourcebox"><div class="label">官方核查</div><div>${source}</div></div><div class="actions"><button onclick='copyAnswer(${JSON.stringify(i)}, ${JSON.stringify(rows)})'>复制回答</button><button onclick="this.closest('.card').classList.remove('open')">收起</button></div></div></article>`
 }).join(''):'<div class="empty">没有匹配的问题。试试“APS”“跨专业”“VPD”“打工”“双非”“德语”等关键词。</div>';
}
function copyAnswer(i,rows){const x=rows[i]; navigator.clipboard.writeText(x.answer).then(()=>toast('已复制回答'));}
function toast(t){const el=$('#toast');el.textContent=t;el.style.opacity=1;setTimeout(()=>el.style.opacity=0,1200)}
const cats=['全部',...new Set(DATA.map(x=>x.cat))];
$('#filters').innerHTML=cats.map((c,i)=>`<button class="${i===0?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');
$('#filters').addEventListener('click',e=>{if(e.target.dataset.cat){cat=e.target.dataset.cat;[...$('#filters').children].forEach(b=>b.classList.toggle('active',b===e.target));render()}});
$('#search').addEventListener('input',render);
$('#policy').addEventListener('click',e=>{policyOnly=!policyOnly;e.currentTarget.classList.toggle('active',policyOnly);render()});
$('#expand').addEventListener('click',()=>document.querySelectorAll('.card').forEach(c=>c.classList.add('open')));
$('#clear').addEventListener('click',()=>{$('#search').value='';cat='全部';policyOnly=false;[...$('#filters').children].forEach((b,i)=>b.classList.toggle('active',i===0));$('#policy').classList.remove('active');render()});
render();
</script></body></html>
